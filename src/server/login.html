<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram Tracker</title>
<style>
:root { color-scheme: light; --plane:#f7f7f5; --surface:#fff; --ink:#111110; --muted:#8a8880;
  --line:#e5e4dd; --line-2:#d6d5cc; --s1:#2a78d6; --bad:#c9331f; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --plane:#0c0c0b; --surface:#181817;
  --ink:#f7f7f5; --muted:#8a8880; --line:#2a2a27; --line-2:#37372f; --s1:#4a94ec; --bad:#f0563d; } }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:var(--plane); color:var(--ink); font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif; }
form { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:30px 28px;
  width:min(360px,92vw); box-shadow:0 8px 28px rgba(0,0,0,.10); }
h1 { font-size:18px; margin:0 0 4px; letter-spacing:-0.02em; }
p.sub { color:var(--muted); font-size:13px; margin:0 0 18px; }
input { width:100%; padding:11px 12px; font:inherit; border:1px solid var(--line-2);
  border-radius:9px; background:var(--plane); color:var(--ink); }
input:focus-visible { outline:2px solid var(--s1); outline-offset:2px; }
button { margin-top:12px; width:100%; padding:11px; font:inherit; font-weight:600; border:0;
  border-radius:9px; background:var(--s1); color:#fff; cursor:pointer; }
button:hover { filter:brightness(1.08); }
.err { color:var(--bad); font-size:12.5px; margin-top:10px; min-height:16px; }
</style></head>
<body>
<form method="POST" action="/login">
  <h1>Instagram Tracker</h1>
  <p class="sub">This dashboard holds your full social graph and message history.</p>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password"
         autofocus aria-label="Password" required>
  <button type="submit">Unlock</button>
  <div class="err">__ERROR__</div>
</form>
</body></html>
